<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img">
  <rect width="880" height="220" fill="#0c0c14"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#f5f5f7">
    <g>
      <rect x="24" y="32" width="260" height="156" rx="12" fill="#14141f" stroke="rgba(255,255,255,0.14)"/>
      <text x="40" y="68" font-size="16">Platform list price</text>
      <text x="40" y="100" font-size="13" fill="#b0b0bc">Monthly, or a year</text>
      <text x="40" y="120" font-size="13" fill="#b0b0bc">paid up front.</text>
      <text x="40" y="148" font-size="13" fill="#b0b0bc">$0 when a free</text>
      <text x="40" y="168" font-size="13" fill="#b0b0bc">plan already sends.</text>
    </g>
    <g>
      <rect x="310" y="32" width="260" height="156" rx="12" fill="#14141f" stroke="rgba(255,255,255,0.14)"/>
      <text x="326" y="68" font-size="16">Email allowance</text>
      <text x="326" y="100" font-size="13" fill="#b0b0bc">Matters when the</text>
      <text x="326" y="120" font-size="13" fill="#b0b0bc">plan counts sends.</text>
      <text x="326" y="148" font-size="13" fill="#b0b0bc">Ignored when the</text>
      <text x="326" y="168" font-size="13" fill="#b0b0bc">vendor says unlimited.</text>
    </g>
    <g>
      <rect x="596" y="32" width="260" height="156" rx="12" fill="#14141f" stroke="rgba(255,255,255,0.14)"/>
      <text x="612" y="68" font-size="16">Payment fee</text>
      <text x="612" y="100" font-size="13" fill="#b0b0bc">Only if readers pay</text>
      <text x="612" y="120" font-size="13" fill="#b0b0bc">inside the tool.</text>
      <text x="612" y="148" font-size="13" fill="#b0b0bc">Separate from the</text>
      <text x="612" y="168" font-size="13" fill="#b0b0bc">monthly plan.</text>
    </g>
  </g>
</svg>
