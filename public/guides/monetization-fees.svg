      <text x="24" y="78" font-size="15">Substack 10%</text>
      <rect x="220" y="62" width="400" height="22" rx="6" fill="#8b7cff"/>
      <text x="632" y="78" font-size="14">$100</text>
    </g>
    <g>
      <text x="24" y="122" font-size="15">beehiiv paid plan</text>
      <rect x="220" y="106" width="8" height="22" rx="4" fill="#22d3ee"/>
